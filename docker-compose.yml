version: "3.9"

services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: symfony_php
        volumes:
            - .:/var/www

    nginx:
        image: nginx:alpine
        container_name: symfony_nginx
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
